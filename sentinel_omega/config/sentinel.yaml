app:
  name: sentinel-omega
  version: "2.5.4"
  environment: development
  debug: true
database:
  geodynamic_db: "data/SENTINEL_OMEGA_PRO.db"
  lottery_db: "data/TITAN_MEMORY.db"
  ensure_dir: true
logging:
  level: INFO
  format: json
  file: "logs/sentinel_omega.log"
  max_bytes: 10485760
  backup_count: 5
  structured: true
api:
  timeout: 15
  max_retries: 3
  backoff_factor: 1.5
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
    half_open_max_calls: 3
telegram:
  # OJO: esta bandera NO apaga Telegram. Verificado el 2026-10-08 con un grep
  # del repo: su único lector era el banner del arranque, que por eso decía
  # «OFF (dry run)» mientras el sistema enviaba. Quien decide de verdad es
  # `SENTINEL_DRY_RUN` más la presencia de TELEGRAM_BOT_TOKEN/CHAT_ID. Se deja
  # para no romper nada que la lea mañana, pero no es el interruptor.
  enabled: false
  heartbeat_interval_s: 14400
  cooldown_s: 1800
  rate_limit_per_second: 1
pipeline:
  locf_enabled: true
  max_lookback_days: 90
  min_data_points: 10
  enable_satellite: false
  enable_jupiter: true
models:
  enabled: true
  models_dir: "models"
  fallback_to_mock: true
  use_gpu: true
precursor:
  # D1 2026-11-12: valores del MOTOR (risk_calculator.py: 11.5/28.6/
  # 77.7, percentiles 50/90/98). Los anteriores (5/10/20/30) eran una
  # CUARTA escala distinta de V32 (5/15/30) y del motor.
  # OJO: esta sección NO SE LEE: load_config()
  # (config/sentinel_config.py) solo fusiona database, wal, juez y
  # telegram; ningún código lee la clave `precursor` (grep repo
  # 2026-11-12: 0 lectores). Se actualiza para no mentir si alguien
  # la lee mañana, no porque el sistema la use. `phantom_threshold`
  # es el HIGH del motor, el que usa _scan_fantasma como gate.
  phantom_threshold: 28.6
  risk_levels:
    low: 0.0
    moderate: 11.5
    high: 28.6
    critical: 77.7
wal:
  # El registro de escritura (WAL) llego a 999,8 MB el 2026-09-25, mas que la
  # base, porque el volcado automatico de SQLite venia fallando: un lector de
  # larga vida mantiene una instantanea abierta y no se pueden reclamar las
  # paginas. Y una copia hecha con `cp` en ese estado NO incluye el WAL.
  umbral_mb: 200        # P2 2026-11-10: bajado de 800; el ciclo lo revisa y vuelca si lo pasa
  vaciado_diario: true  # y a medianoche, con el barrido, pase lo que pase
juez:
  # Peso con el que vota cada bot. false = paseo multiplicativo (el de siempre);
  # true = merito medido contra quedarse callado. Medido el 2026-09-25: con el
  # paseo, 8 de 9 bots clavados en 1.000 y un castigo borrado en 5,9 h; con el
  # merito, dispersion 0.298 y se ve que solo beta2 le gana al silencio.
  # Encenderlo cambia como VOTA el consenso: decision del operador.
  # Encendido el 2026-09-25 por orden del operador, con la medida delante:
  # beta2 pasa a pesar 1.295 (11 de 37 eventos con 1 falsa alarma) y alfa1 a
  # 0.300 (544 falsas alarmas por 5 detecciones), en vez de 1.000 los dos.
  # Para revertir: poner false y reiniciar sentinel-omega.
  peso_por_merito: true
  minimo_ventanas: 50
consensus:
  min_families_for_alert: 2
  confidence_threshold: 0.6
  watch_confidence_threshold: 0.35
scheduler:
  cycle_interval_minutes: 30
  heartbeat_interval_minutes: 60
  cleanup_interval_hours: 24
